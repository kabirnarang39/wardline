apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardline.fullname" . }}-config
  labels:
    {{- include "wardline.labels" . | nindent 4 }}
type: Opaque
stringData:
  wardline.yaml: |
    listen: ":{{ .Values.containerPort }}"
    upstream: {{ .Values.wardline.upstream | quote }}
    policy_file: "/config/policy"
    policy_backend: {{ .Values.wardline.policyBackend | quote }}
    {{- if .Values.wardline.shutdownDelaySeconds }}
    shutdown_delay_seconds: {{ .Values.wardline.shutdownDelaySeconds }}
    {{- end }}
    {{- if .Values.wardline.grpcListen }}
    grpc_listen: {{ .Values.wardline.grpcListen | quote }}
    {{- end }}
    {{- if .Values.wardline.grpcUpstream }}
    grpc_upstream: {{ .Values.wardline.grpcUpstream | quote }}
    {{- end }}
    {{- if or .Values.wardline.credentialSigningKeyFile .Values.wardline.credentialIdentitiesFile .Values.wardline.credential }}
    credential:
      {{- if .Values.wardline.credentialSigningKeyFile }}
      signing_key_file: {{ .Values.wardline.credentialSigningKeyFile | quote }}
      {{- end }}
      {{- if .Values.wardline.credentialIdentitiesFile }}
      identities_file: {{ .Values.wardline.credentialIdentitiesFile | quote }}
      {{- end }}
      {{- with .Values.wardline.credential }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    audit:
      output: {{ .Values.wardline.audit.output | quote }}
      postgres_dsn: {{ .Values.wardline.audit.postgresDsn | quote }}
    budget:
      requests_per_window: {{ .Values.wardline.budget.requestsPerWindow }}
      window_seconds: {{ .Values.wardline.budget.windowSeconds }}
    tracing:
      otlp_endpoint: {{ .Values.wardline.tracing.otlpEndpoint | quote }}
      service_name: {{ .Values.wardline.tracing.serviceName | quote }}
    {{- if .Values.wardline.rbac }}
    rbac:
      {{- toYaml .Values.wardline.rbac | nindent 6 }}
    {{- end }}
    {{- if .Values.wardline.anomaly }}
    anomaly:
      {{- toYaml .Values.wardline.anomaly | nindent 6 }}
    {{- end }}
    {{- if .Values.wardline.scim }}
    scim:
      {{- toYaml .Values.wardline.scim | nindent 6 }}
    {{- end }}
    {{- if .Values.wardline.federation }}
    federation:
      {{- toYaml .Values.wardline.federation | nindent 6 }}
    {{- end }}
    {{- if .Values.wardline.compliance }}
    compliance:
      {{- toYaml .Values.wardline.compliance | nindent 6 }}
    {{- end }}
    {{- if .Values.wardline.retention }}
    retention:
      {{- toYaml .Values.wardline.retention | nindent 6 }}
    {{- end }}
    features:
      {{- if .Values.wardline.features }}
      {{- range $key, $val := .Values.wardline.features }}
      {{ $key }}: {{ $val }}
      {{- end }}
      {{- else }}
      {}
      {{- end }}
