# No published image exists yet (no CI publishes to this path) — point this
# at an image you've built and pushed yourself, e.g. via `docker build -t
# <your-registry>/wardline:<tag> . && docker push ...` (see README's
# Kubernetes / Helm section).
image:
  repository: ghcr.io/kabirnarang39/wardline
  tag: ""   # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# nameOverride: ""
# fullnameOverride: ""

replicaCount: 1

# A PodDisruptionBudget is only rendered when replicaCount > 1 (see
# templates/pdb.yaml) -- minAvailable here only takes effect at that
# point.
podDisruptionBudget:
  minAvailable: 1

# Soft (preferred, not required) anti-affinity spreading replicas across
# nodes -- only applied when replicaCount > 1, and "preferred" rather
# than "required" so the chart stays schedulable on a single-node dev
# cluster, a common way this chart gets tried out first.
podAntiAffinity:
  enabled: true

# terminationGracePeriodSeconds must stay comfortably larger than
# wardline.shutdownDelaySeconds below plus main.go's own ~15s shutdown
# budget (10s HTTP drain + 5s tracing-flush) -- explicit here (rather
# than relying on Kubernetes' default, which happens to also be 30)
# so a future change to any of the three numbers is visible in the same
# review instead of independent defaults silently agreeing by
# coincidence.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8080

# The port the wardline container actually listens on (and binds inside
# wardline.yaml). Kept separate from service.port: the Service's targetPort
# resolves by name ("http"), so service.port can be changed freely (e.g. to
# a privileged port like 80) without affecting what the non-root container
# binds to.
containerPort: 8080

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Extra volumes/volumeMounts appended verbatim (via toYaml) to the pod
# spec and the wardline container respectively -- the supported way to
# mount a signing-key Secret (see wardline.credentialSigningKeyFile
# below) or an identities file that isn't already templated by this
# chart. Example:
#   extraVolumes:
#     - name: signing-key
#       secret:
#         secretName: wardline-signing-key
#   extraVolumeMounts:
#     - name: signing-key
#       mountPath: /etc/wardline-secrets
#       readOnly: true
# then set wardline.credentialSigningKeyFile: /etc/wardline-secrets/signing-key.pem
extraVolumes: []
extraVolumeMounts: []

# wardline mirrors internal/platform/config.Config's YAML shape exactly.
wardline:
  upstream: "http://your-mcp-server:9000"
  policyBackend: yaml   # "yaml", "opa", or "cedar" — see policy.rego.example / policy.cedar.example in the main repo for the OPA/Cedar shape
  # How long (seconds) wardline keeps serving normally after SIGTERM
  # before it starts draining -- an in-process substitute for a
  # Kubernetes preStop sleep (buys real Endpoints-propagation time
  # without depending on a shell in the container; Wardline's own image
  # is distroless and has none). 0 disables the delay. See
  # internal/platform/config.Config.ShutdownDelaySeconds' doc comment.
  shutdownDelaySeconds: 5
  # Required for features.credential_issuance to work correctly across
  # more than one replica -- mount a PEM RSA private key (e.g. via
  # `openssl genrsa -out signing-key.pem 2048`) as its own Secret,
  # attach it via extraVolumes/extraVolumeMounts above, and point this
  # at its mounted path; empty leaves every replica generating its own
  # key (single-replica only). See README.md "HA deployment".
  credentialSigningKeyFile: ""
  # Required for features.credential_issuance regardless of replica
  # count (internal/platform/config.Config.validate rejects
  # credential_issuance without it) -- same extraVolumes/extraVolumeMounts
  # mounting pattern as credentialSigningKeyFile above.
  credentialIdentitiesFile: ""
  # must be a YAML string (use a "|" block scalar) or --set-file — NOT a
  # nested map; Wardline's policy loader expects raw file content, and this
  # key is rendered verbatim into a ConfigMap.
  policy: |
    rules: []
    default: deny
  # gRPC transport (features.grpc_transport). Both required when that flag
  # is on. See README "gRPC transport".
  grpcListen: ""       # e.g. ":8081"
  grpcUpstream: ""     # e.g. "your-grpc-upstream:50051"
  grpcUpstreamTls: false   # dial grpcUpstream over TLS (system root pool) instead of plaintext
  # Extra credential.* fields beyond signing_key_file/identities_file above,
  # rendered verbatim (mirrors config.CredentialConfig): bootstrap_source
  # and the oidc/mtls sub-blocks. Mount any referenced files via
  # extraVolumes/extraVolumeMounts.
  credential: {}
    # bootstrap_source: oidc
    # oidc:
    #   issuer: "https://idp.example.com/"
    #   jwks_uri: "https://idp.example.com/.well-known/jwks.json"
    #   audience: "wardline"
    # mtls:
    #   header: "X-Wardline-Verified-Spiffe-Id"
  features: {}
  audit:
    output: stdout
    postgresDsn: ""
  budget:
    requestsPerWindow: 0
    windowSeconds: 0
  tracing:
    otlpEndpoint: ""
    serviceName: ""
  # RBAC config, rendered into wardline.yaml verbatim only when set (mirrors
  # config.RBACConfig). rbac.config_file must point at a roles/bindings file
  # you mount via extraVolumes/extraVolumeMounts, the same pattern as
  # credentialIdentitiesFile above. Also set features.rbac: true.
  rbac: {}
    # config_file: /etc/wardline-rbac/rbac.yaml
  # Anomaly-detection config, rendered verbatim only when set (mirrors
  # config.AnomalyConfig's full nested shape). anomaly.output must be a
  # writable path distinct from audit.output. Also set
  # features.anomaly_detection: true. See README "Anomaly detection".
  anomaly: {}
    # output: /var/lib/wardline/anomaly.jsonl
    # window_seconds: 60
    # rate_spike: { enabled: true, rate_multiplier: 3.0, min_calls: 10 }
    # novel_tool: { enabled: true }
    # deny_rate_spike: { enabled: true, threshold: 0.5, min_calls: 5 }
    # ml_score: { enabled: true, score_threshold: 3.0, min_calls: 5 }
    # auto_block: { enabled: true, score_threshold: 4.0, block_duration_seconds: 300 }
  # SCIM provisioning config (features.scim), rendered verbatim (mirrors
  # config.ScimConfig). Also set features.scim: true.
  scim: {}
    # bearer_token_env: WARDLINE_SCIM_TOKEN
    # persist_postgres: false
  # Federation config (features.federation, requires anomaly_detection),
  # rendered verbatim (mirrors config.FederationConfig). Mount the signing
  # key / shared secret / peers file via extraVolumes/extraVolumeMounts.
  federation: {}
    # instance_id: "eu-cluster-1"
    # peers_file: /etc/wardline-fed/peers.yaml
    # signing_key_file: /etc/wardline-fed/signing-key.pem
    # shared_secret_file: /etc/wardline-fed/shared-secret
    # min_instances_for_correlation: 2
  # Scheduled compliance export (features.compliance_scheduled_export),
  # rendered verbatim (mirrors config.ComplianceConfig).
  compliance: {}
    # scheduled_export_interval_seconds: 86400
    # scheduled_export_output_dir: /var/lib/wardline/evidence
  # Log retention (features.log_retention), rendered verbatim (mirrors
  # config.RetentionConfig). Set audit.retention_days / anomaly.retention_days too.
  retention: {}
    # check_interval_seconds: 3600

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wardline.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
