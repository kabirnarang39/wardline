apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wardline.fullname" . }}
  labels:
    {{- include "wardline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wardline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
        checksum/policy: {{ include (print $.Template.BasePath "/configmap-policy.yaml") . | sha256sum }}
      labels:
        {{- include "wardline.selectorLabels" . | nindent 8 }}
    spec:
      {{- /*
      wardline.shutdownDelaySeconds runs BEFORE main.go's own ~15s drain
      budget (10s HTTP drain + 5s tracing flush), both inside the same
      terminationGracePeriodSeconds window -- if the delay alone already
      leaves no room for that fixed budget, SIGKILL lands mid-drain,
      which is worse than not setting a delay at all (the in-flight-
      request-drop this feature exists to prevent). Fail the render
      rather than ship a config that silently defeats its own purpose.
      */}}
      {{- if ge (add (.Values.wardline.shutdownDelaySeconds | int) 15) (.Values.terminationGracePeriodSeconds | int) }}
      {{- fail (printf "wardline.shutdownDelaySeconds (%d) + main.go's ~15s drain budget must be less than terminationGracePeriodSeconds (%d), or SIGKILL can land before the drain completes" (.Values.wardline.shutdownDelaySeconds | int) (.Values.terminationGracePeriodSeconds | int)) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if and .Values.podAntiAffinity.enabled (gt (.Values.replicaCount | int) 1) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "wardline.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wardline
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - serve
            - -config
            - /etc/wardline/wardline.yaml
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            # health/adapter.Handler bounds its own Postgres ping at 2s
            # (pingTimeout) when postgres_storage is on -- the default
            # kubelet timeoutSeconds (1) would kill the probe before
            # that 2s budget is ever reached, making a merely-slow (not
            # broken) database look like a failed probe. 3s gives that
            # budget real headroom.
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/wardline
              readOnly: true
            - name: policy
              mountPath: /config
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "wardline.fullname" . }}-config
        - name: policy
          configMap:
            name: {{ include "wardline.fullname" . }}-policy
            items:
              - key: policy
                path: policy
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
