<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 132" width="560" height="132" role="img" aria-label="Wardline — control plane for AI agents">
  <defs>
    <linearGradient id="wl-bar-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <clipPath id="wl-bar-clip-dark">
      <rect x="20" y="26" width="12" height="80" rx="3"/>
    </clipPath>
  </defs>

  <!-- The mark: the same vertical gradient bar the dashboard header and
       login page actually use (see internal/features/dashboard/adapter/
       web/dist/style.css's .brand-mark), one real identity across the
       product and this README, not a second logo invented for GitHub. -->
  <rect x="20" y="26" width="12" height="80" rx="3" fill="url(#wl-bar-dark)"/>

  <!-- A signal passing through the bar, looping: the same idea the
       product enforces on every call, something always moving
       through the check, top to bottom, never invisible. -->
  <g clip-path="url(#wl-bar-clip-dark)">
    <rect x="18" y="26" width="16" height="20" fill="#F8FAFC" opacity="0">
      <animate attributeName="y" values="16;96" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.15;0.75;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="50" y="84" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-2" fill="#F8FAFC">wardline</text>
  <text x="53" y="112" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" letter-spacing="0.6" fill="#8B95A1">control plane for AI agents</text>
</svg>
