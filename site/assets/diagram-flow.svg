<svg viewBox="0 0 760 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request flow: Agent calls Wardline, which checks policy, then forwards to the upstream MCP server while writing to the audit log">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, monospace" font-size="14" fill="#111111">
    <rect x="10" y="40" width="140" height="60" rx="8" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="80" y="75" text-anchor="middle">Agent</text>

    <line x1="150" y1="70" x2="230" y2="70" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="240" y="20" width="160" height="100" rx="8" fill="none" stroke="#16A34A" stroke-width="1.5"/>
    <text x="320" y="60" text-anchor="middle" font-weight="600">Wardline</text>
    <text x="320" y="80" text-anchor="middle" font-size="12">identity + policy</text>
    <text x="320" y="98" text-anchor="middle" font-size="12">+ budget + audit</text>

    <line x1="400" y1="70" x2="480" y2="70" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="490" y="40" width="160" height="60" rx="8" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="570" y="75" text-anchor="middle">Upstream MCP</text>

    <line x1="320" y1="120" x2="320" y2="135" stroke="#111111" stroke-width="1"/>
    <text x="320" y="135" text-anchor="middle" font-size="11" fill="#555555" dy="10">audit log</text>
  </g>
</svg>