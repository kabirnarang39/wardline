# Rename REPLACE_WITH_ADMIN_IDENTITY and REPLACE_WITH_VIEWER_IDENTITY to
# your real identities, and edit the viewer's tool list to match what your
# MCP server actually exposes -- read_file/list_files/get_status are
# examples, not universal tool names.
rules:
  - identity: "REPLACE_WITH_ADMIN_IDENTITY"
    tool: "*"
    effect: allow
  - identity: "REPLACE_WITH_VIEWER_IDENTITY"
    tool: "read_file"
    effect: allow
  - identity: "REPLACE_WITH_VIEWER_IDENTITY"
    tool: "list_files"
    effect: allow
  - identity: "REPLACE_WITH_VIEWER_IDENTITY"
    tool: "get_status"
    effect: allow
  - identity: "REPLACE_WITH_VIEWER_IDENTITY"
    tool: "*"
    effect: deny
default: deny
