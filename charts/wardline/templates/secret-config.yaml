apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardline.fullname" . }}-config
  labels:
    {{- include "wardline.labels" . | nindent 4 }}
type: Opaque
stringData:
  wardline.yaml: |
    listen: ":{{ .Values.containerPort }}"
    upstream: {{ .Values.wardline.upstream | quote }}
    policy_file: "/config/policy"
    policy_backend: {{ .Values.wardline.policyBackend | quote }}
    audit:
      output: {{ .Values.wardline.audit.output | quote }}
      postgres_dsn: {{ .Values.wardline.audit.postgresDsn | quote }}
    budget:
      requests_per_window: {{ .Values.wardline.budget.requestsPerWindow }}
      window_seconds: {{ .Values.wardline.budget.windowSeconds }}
    tracing:
      otlp_endpoint: {{ .Values.wardline.tracing.otlpEndpoint | quote }}
      service_name: {{ .Values.wardline.tracing.serviceName | quote }}
    features:
      {{- if .Values.wardline.features }}
      {{- range $key, $val := .Values.wardline.features }}
      {{ $key }}: {{ $val }}
      {{- end }}
      {{- else }}
      {}
      {{- end }}
